name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: onde o RDF roda de verdade (versão do instalador)
          - os: windows-latest
            python: '3.13'
          # Linux com o Python mínimo suportado: pega o uso de algo novo demais
          - os: ubuntu-latest
            python: '3.11'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bibliotecas do sistema para o Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Testes com cobertura
        run: |
          python -m coverage run -m unittest discover -s tests -q
          python -m coverage report
