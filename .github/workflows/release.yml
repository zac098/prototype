name: Instalador

# Gera o RDF (PyInstaller, receita em packaging/rdf.spec) e o RDF_Setup.exe (Inno Setup) numa máquina Windows, com o
# Tesseract (por e eng) embutido, como o packaging/build_package.bat faz no computador de quem empacota. Antes de
# publicar, cada entrega roda o próprio autoteste (RDF.exe --autoteste): OCR de verdade, PDFs e todas as telas.
# - Na main, com uma APP_VERSION que ainda não tem release (ou com uma tag "v4.0.0" enviada à mão): cria a tag e a
#   release no GitHub com os dois .exe e o SHA-256. Versão já publicada: não faz nada.
# - Manual (Actions > Instalador > Run workflow) ou num PR que mexa no empacotamento: só gera os arquivos para baixar.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'rdf_app.py'
      - 'rdf/**'
      - 'assets/**'

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import rdf; print(rdf.APP_VERSION)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "A tag $env:GITHUB_REF_NAME não bate com a versão do app (v$version, em rdf/__init__.py)."
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Versão: $version"
          # Na main: publica só se esta versão ainda não tem release (um push qualquer não refaz a 4.0.0).
          $publish = $env:GITHUB_REF_TYPE -eq 'tag'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
            $publish = $LASTEXITCODE -ne 0
            $global:LASTEXITCODE = 0
          }
          "PUBLISH=$publish" >> $env:GITHUB_ENV
          Write-Host "Publicar release: $publish"

      - name: Tesseract OCR (português e inglês)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $dir = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path "$dir\tesseract.exe")) { throw "Tesseract não foi instalado em $dir" }
          foreach ($lang in 'por', 'eng') {
            $file = "$dir\tessdata\$lang.traineddata"
            if (-not (Test-Path $file)) {
              Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata/raw/main/$lang.traineddata" -OutFile $file -MaximumRetryCount 5 -RetryIntervalSec 15
            }
          }
          & "$dir\tesseract.exe" --list-langs
          "TESSERACT_DIR=$dir" >> $env:GITHUB_ENV

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV
          Write-Host "Inno Setup: $($iscc.FullName)"

      - name: Dependências
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: RDF (PyInstaller) - pasta para o instalador e versão portátil
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging\rdf.spec
          foreach ($file in 'dist\RDF\RDF.exe', 'dist\RDF_portatil.exe') {
            if (-not (Test-Path $file)) { throw "O PyInstaller não gerou o $file" }
          }

      - name: Tamanho do pacote
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\RDF -Recurse -File
          $base = (Resolve-Path dist\RDF).Path
          Write-Host ("Pasta instalada: {0:N1} MB em {1} arquivos" -f (($files | Measure-Object Length -Sum).Sum / 1MB), $files.Count)
          Write-Host ("Portátil: {0:N1} MB" -f ((Get-Item dist\RDF_portatil.exe).Length / 1MB))
          $files | Sort-Object Length -Descending | Select-Object -First 30 | ForEach-Object {
            "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($base.Length + 1)
          }

      - name: Autoteste do app empacotado
        shell: pwsh
        run: |
          foreach ($exe in 'dist\RDF\RDF.exe', 'dist\RDF_portatil.exe') {
            $report = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($exe) + '-autoteste.json')
            $process = Start-Process -FilePath $exe -ArgumentList '--autoteste', $report -PassThru
            $null = $process.Handle  # sem isto o PowerShell pode perder o código de saída
            if (-not $process.WaitForExit(600000)) {
              Stop-Process -Id $process.Id -Force
              throw "O autoteste de $exe não terminou em 10 minutos"
            }
            if (Test-Path $report) { Get-Content $report -Encoding utf8 | Write-Host } else { Write-Host "Sem relatório em $report" }
            if ($process.ExitCode -ne 0) { throw "O autoteste de $exe falhou (código $($process.ExitCode))" }
          }

      - name: RDF_Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          & $env:ISCC "/DMyAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'O Inno Setup falhou' }
          New-Item -ItemType Directory -Force entrega | Out-Null
          Copy-Item installer_output\RDF_Setup.exe "entrega\RDF_Setup_$env:APP_VERSION.exe"
          Copy-Item dist\RDF_portatil.exe "entrega\RDF_portatil_$env:APP_VERSION.exe"
          Push-Location entrega
          Get-ChildItem *.exe | ForEach-Object { Write-Host ("{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }
          Get-ChildItem *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Notas da versão (do docs/CHANGELOG.md)
        shell: pwsh
        run: |
          $lines = Get-Content docs\CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($env:APP_VERSION))" | Select-Object -First 1).LineNumber
          $notes = @()
          if ($start) {
            foreach ($line in $lines[$start..($lines.Count - 1)]) {
              if ($line -match '^## ') { break }
              $notes += $line
            }
          }
          $intro = @(
            '**Como instalar:** baixe o `RDF_Setup_' + $env:APP_VERSION + '.exe` abaixo e execute (não pede administrador; atualiza a versão anterior mantendo as configurações).',
            'O `RDF_portatil_' + $env:APP_VERSION + '.exe` roda sem instalar (sem o menu "Imprimir com o RDF" do botão direito).',
            ''
          )
          ($intro + $notes) | Set-Content -Encoding utf8 notas.md

      - uses: actions/upload-artifact@v4
        with:
          name: RDF-${{ env.APP_VERSION }}
          path: entrega/*

      - name: Publicar a release
        if: env.PUBLISH == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: RDF ${{ env.APP_VERSION }}
          body_path: notas.md
          files: entrega/*
